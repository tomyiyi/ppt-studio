# ppt-studio 轻量 CI：依赖安装 + 编译 + --help 烟雾 + 可选渲染烟雾
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: smoke (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile all scripts
        run: python -m compileall scripts

      - name: CLI smoke (--help)
        run: |
          python scripts/analyze_image.py --help
          python scripts/boost_ink.py --help
          python scripts/run_auto_poc.py --help

  render-smoke:
    # 可选渲染烟雾：需要下载 Chromium；跑不通不阻塞（continue-on-error）
    name: render smoke (optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Render one sample page
        run: python scripts/render_svg.py projects/agentflow-os-launch/svg_output /tmp/ci_render --only 01

      - name: Check PNG produced
        run: test -s /tmp/ci_render/01_cover.png
