<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" font-family='"PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", Arial, sans-serif'>
<defs>
  <linearGradient id="band-scrim" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#08090C" stop-opacity="0.78"/>
    <stop offset="0.22" stop-color="#08090C" stop-opacity="0.28"/>
    <stop offset="0.58" stop-color="#08090C" stop-opacity="0.05"/>
    <stop offset="1" stop-color="#08090C" stop-opacity="0.16"/>
  </linearGradient>
  <linearGradient id="band-fade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#08090C" stop-opacity="0"/>
    <stop offset="1" stop-color="#08090C" stop-opacity="0.96"/>
  </linearGradient>
  <linearGradient id="panel-grad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#12131B" stop-opacity="1"/>
    <stop offset="1" stop-color="#08090C" stop-opacity="1"/>
  </linearGradient>
</defs>
<g id="card-image">
  <rect width="1080" height="821" fill="#08090C"/>
  <image href="../images/bus_bg.png" x="0" y="0" width="1080" height="821" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1080" height="821" fill="url(#band-scrim)"/>
  <rect x="0" y="691" width="1080" height="130" fill="url(#band-fade)"/>
</g>
  <text x="80" y="112" font-size="28" fill="#A8A9B4" letter-spacing="6">CAPABILITY TWO · 05</text>
  <rect x="912" y="80" width="88" height="60" rx="30" fill="#6E7BFF"/>
  <text x="956" y="121" text-anchor="middle" font-size="36" font-weight="bold" font-family='Arial, Helvetica, sans-serif' fill="#08090C">6</text>
  <text x="1000" y="168" text-anchor="end" font-size="28" fill="#A8A9B4">类接入方式</text>
<g id="card-panel">
  <rect x="0" y="821" width="1080" height="529" fill="url(#panel-grad)"/>
      <text x="124" y="951" font-size="72" fill="#F7F7F9" font-weight="bold"><tspan fill="#F7F7F9">你现有的工具照旧用</tspan></text>
      <text x="124" y="1058" font-size="36" fill="#A8A9B4"><tspan fill="#6E7BFF">它学会用你的工具，而不是让你换工具。</tspan></text>
      <text x="124" y="1168" font-size="36" fill="#A8A9B4"><tspan fill="#8E8F9A">不用为了上智能体先做一轮系统改造。</tspan></text>
  <rect x="80" y="901" width="6" height="80" rx="3" fill="#6E7BFF"/>
  <line x1="80" y1="1206" x2="1000" y2="1206" stroke="#23242E" stroke-width="1"/>
  <text x="1000" y="1250" text-anchor="end" font-size="28" fill="#7F8090">05 / 07</text>
  <text x="80" y="1250" font-size="28" fill="#7F8090">智流 OS</text>
</g>
</svg>