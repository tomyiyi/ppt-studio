<g id="card-image">
  <rect width="1080" height="644" fill="#08090C"/>
  <image href="../images/cover_bg.png" x="0" y="0" width="1080" height="644" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1080" height="644" fill="url(#band-scrim)"/>
  <rect x="0" y="514" width="1080" height="130" fill="url(#band-fade)"/>
</g>
  <text x="80" y="112" font-size="28" fill="#A8A9B4" letter-spacing="6">PRODUCT LAUNCH · 2026</text>
<g id="card-panel">
  <rect x="0" y="644" width="1080" height="706" fill="url(#panel-grad)"/>
      <text x="124" y="822" font-size="132" fill="#F7F7F9" font-weight="bold"><tspan fill="#F7F7F9">智流 OS</tspan></text>
      <text x="124" y="965" font-size="56" fill="#6E7BFF"><tspan fill="#6E7BFF">AgentFlow OS</tspan></text>
      <text x="124" y="1059" font-size="36" fill="#A8A9B4"><tspan fill="#8E8F9A">连接大模型与现实业务的自主智能体协作引擎</tspan></text>
      <text x="124" y="1169" font-size="36" fill="#A8A9B4"><tspan fill="#F7F7F9">不是更大的模型，是能真正动手的运行时</tspan></text>
  <rect x="80" y="724" width="6" height="132" rx="3" fill="#6E7BFF"/>
  <line x1="80" y1="1206" x2="1000" y2="1206" stroke="#23242E" stroke-width="1"/>
  <text x="1000" y="1250" text-anchor="end" font-size="28" fill="#7F8090">01 / 07</text>
  <text x="80" y="1250" font-size="28" fill="#7F8090">智流 OS</text>
