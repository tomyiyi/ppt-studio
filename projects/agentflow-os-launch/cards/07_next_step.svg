<g id="card-image">
  <rect width="1080" height="725" fill="#08090C"/>
  <image href="../images/next_bg.png" x="0" y="0" width="1080" height="725" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1080" height="725" fill="url(#band-scrim)"/>
  <rect x="0" y="595" width="1080" height="130" fill="url(#band-fade)"/>
</g>
  <text x="80" y="112" font-size="28" fill="#A8A9B4" letter-spacing="6">NEXT STEP · 07</text>
<g id="card-panel">
  <rect x="0" y="725" width="1080" height="625" fill="url(#panel-grad)"/>
      <text x="124" y="855" font-size="72" fill="#F7F7F9" font-weight="bold"><tspan fill="#F7F7F9">挑一个你最不想再手工做的</tspan></text>
      <text x="124" y="951" font-size="72" fill="#F7F7F9" font-weight="bold"><tspan fill="#F7F7F9">流程</tspan><tspan fill="#6E7BFF">交给它跑两周</tspan></text>
      <text x="124" y="1059" font-size="36" fill="#A8A9B4"><tspan fill="#8E8F9A">接进来，给它权限边界，然后看它怎么收尾。</tspan></text>
      <text x="124" y="1169" font-size="36" fill="#A8A9B4"><tspan fill="#8E8F9A">不需要先改造系统，不需要先写规范文档。</tspan></text>
  <rect x="80" y="805" width="6" height="177" rx="3" fill="#6E7BFF"/>
  <line x1="80" y1="1206" x2="1000" y2="1206" stroke="#23242E" stroke-width="1"/>
  <text x="1000" y="1250" text-anchor="end" font-size="28" fill="#7F8090">07 / 07</text>
  <text x="80" y="1250" font-size="28" fill="#7F8090">智流 OS</text>
