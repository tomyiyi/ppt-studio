  <g id="capability-text" data-pptx-bounds="77.5 200 538.7 231.9">
    <text x="80" y="258" font-size="56" font-weight="bold" fill="#F7F7F9">你现有的工具照旧用</text>
    <line x1="80" y1="296" x2="200" y2="296" stroke="#23242E" stroke-width="1" />
    <text x="80" y="344" font-size="16" fill="#8E8F9A">不用为了上智能体先做一轮系统改造。</text>
    <text x="80" y="390" font-size="20" fill="#6E7BFF">它学会用你的工具，而不是让你换工具。</text>
    <text x="80" y="426" font-size="13" fill="#8E8F9A">统一语义总线 · 一次接入，所有智能体共享</text>
  </g>

