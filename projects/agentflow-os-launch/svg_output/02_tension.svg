<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif">
  <defs>
    <linearGradient id="tension-scrim-x" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#08090C" stop-opacity="0.92" />
      <stop offset="0.48" stop-color="#08090C" stop-opacity="0.74" />
      <stop offset="0.78" stop-color="#08090C" stop-opacity="0.30" />
      <stop offset="1" stop-color="#08090C" stop-opacity="0.18" />
    </linearGradient>
    <linearGradient id="tension-scrim-y" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08090C" stop-opacity="0.30" />
      <stop offset="0.55" stop-color="#08090C" stop-opacity="0.10" />
      <stop offset="0.74" stop-color="#08090C" stop-opacity="0.88" />
      <stop offset="1" stop-color="#08090C" stop-opacity="0.96" />
    </linearGradient>
  </defs>

  <g id="background">
    <rect width="1280" height="720" fill="#08090C" />
    <image href="../images/tension_bg.png" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid slice" />
    <rect x="0" y="0" width="1280" height="720" fill="url(#tension-scrim-x)" />
    <rect x="0" y="0" width="1280" height="720" fill="url(#tension-scrim-y)" />
  </g>

  <g id="page-kicker">
    <text x="80" y="100" font-size="11" fill="#8E8F9A" letter-spacing="4">THE TENSION · 02</text>
  </g>

  <g id="tension-statement" font-weight="bold" fill="#F7F7F9" font-size="56">
    <text x="80" y="230">流程跑通了 <tspan fill="#6E7BFF">97%</tspan></text>
    <text x="80" y="308">剩下 <tspan fill="#6E7BFF">3%</tspan> 吃掉全部人力</text>
  </g>

  <g id="tension-scene">
    <line x1="80" y1="356" x2="200" y2="356" stroke="#23242E" stroke-width="1" />
    <text x="80" y="404" font-size="20" fill="#8E8F9A">凌晨两点，第三次跑批失败。日志里没有报错，</text>
    <text x="80" y="440" font-size="20" fill="#8E8F9A">只有一个没人预料到的字段格式。</text>
  </g>

  <g id="tension-facts">
    <text x="80" y="524" font-size="44" font-family="Arial, Helvetica, sans-serif" font-weight="bold" fill="#6E7BFF">41%</text>
    <text x="80" y="556" font-size="13" fill="#8E8F9A">自动化项目最终被放弃</text>

    <text x="400" y="524" font-size="44" font-family="Arial, Helvetica, sans-serif" font-weight="bold" fill="#6E7BFF">6.2h</text>
    <text x="400" y="556" font-size="13" fill="#8E8F9A">工程师每周花在修流程上的时间</text>

    <text x="720" y="524" font-size="44" font-family="Arial, Helvetica, sans-serif" font-weight="bold" fill="#6E7BFF">3.4x</text>
    <text x="720" y="556" font-size="13" fill="#8E8F9A">分支数每翻一倍，维护成本的增幅</text>
  </g>

  <g id="footer">
    <line x1="80" y1="608" x2="1200" y2="608" stroke="#23242E" stroke-width="1" />
    <text x="1200" y="648" text-anchor="end" font-size="13" fill="#7F8090">02 / 07</text>
  </g>
</svg>
