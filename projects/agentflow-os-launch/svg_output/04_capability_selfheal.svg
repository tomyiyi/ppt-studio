<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif">
  <defs>
    <linearGradient id="heal-scrim-x" x1="0" y1="0" x2="1" y2="0">
      <stop data-theme-role="content-scrim" offset="0" stop-color="#08090C" stop-opacity="0.92" />
      <stop data-theme-role="content-scrim" offset="0.45" stop-color="#08090C" stop-opacity="0.80" />
      <stop data-theme-role="content-scrim" offset="0.62" stop-color="#08090C" stop-opacity="0.30" />
      <stop data-theme-role="content-scrim" offset="1" stop-color="#08090C" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="heal-scrim-y" x1="0" y1="0" x2="0" y2="1">
      <stop data-theme-role="image-scrim" offset="0" stop-color="#08090C" stop-opacity="0.12" />
      <stop data-theme-role="image-scrim" offset="0.45" stop-color="#08090C" stop-opacity="0" />
      <stop data-theme-role="image-scrim" offset="1" stop-color="#08090C" stop-opacity="0.68" />
    </linearGradient>
  </defs>

  <g id="background">
    <rect width="1280" height="720" fill="#08090C" />
    <image href="../images/heal_bg.png" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid slice" />
    <rect width="1280" height="720" fill="url(#heal-scrim-x)" />
    <rect width="1280" height="720" fill="url(#heal-scrim-y)" />
  </g>

  <g id="readability-surfaces">
    <rect data-theme-role="readability-surface-dark" x="68" y="78" width="205" height="38" fill="#08090C" />
    <rect data-theme-role="readability-surface-light" x="68" y="320" width="296" height="72" fill="#08090C" />
    <rect data-theme-role="readability-surface-light" x="1097" y="219" width="102" height="39" fill="#08090C" />
    <rect data-theme-role="readability-surface-light" x="1140" y="625" width="60" height="39" fill="#08090C" />
  </g>

  <g id="page-kicker">
    <text data-theme-role="on-dark-surface" x="80" y="100" font-size="11" fill="#8E8F9A" letter-spacing="4">CAPABILITY ONE · 04</text>
  </g>

  <g id="capability-icon">
    <g transform="translate(80, 150) scale(1.7)" fill="none" stroke="#6E7BFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13 3l0 7l6 0l-8 11l0 -7l-6 0l8 -11" />
    </g>
  </g>

  <g id="capability-text">
    <text x="80" y="258" font-size="56" font-weight="bold" fill="#F7F7F9">失败不用等人来</text>
    <line x1="80" y1="296" x2="200" y2="296" stroke="#23242E" stroke-width="1" />

    <text data-theme-role="on-light-surface" x="80" y="344" font-size="16" fill="#8E8F9A">任务失败时，它先自己诊断；</text>
    <text data-theme-role="on-light-surface" x="80" y="378" font-size="16" fill="#8E8F9A">能降级就降级，实在不行才交回给人。</text>

    <text x="80" y="424" font-size="20" fill="#F7F7F9">你拿到的不是报错堆栈，</text>
    <text x="80" y="458" font-size="20" fill="#6E7BFF">是已经处理完的结果。</text>
  </g>

  <g id="terminal">
    <rect x="80" y="478" width="480" height="112" rx="8" fill="#0E0F14" fill-opacity="0.66" stroke="#23242E" stroke-width="1" />
    <text data-theme-role="on-dark-surface" x="104" y="508" font-family="Consolas, monospace" font-size="16" fill="#8E8F9A">[exec]  步骤 2 失败 · 字段格式不匹配</text>
    <text data-theme-role="on-dark-surface" x="104" y="538" font-family="Consolas, monospace" font-size="16" fill="#6E7BFF">[heal]  切换容错解析 · 降级继续</text>
    <text data-theme-role="on-dark-surface" x="104" y="568" font-family="Consolas, monospace" font-size="16" fill="#4ADE80">[done]  4/4 完成 · 人工介入 0 次</text>
  </g>

  <g id="badge">
    <circle cx="1148" cy="196" r="22" fill="#4ADE80" />
    <text data-theme-role="on-accent" x="1148" y="204" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#08090C">0</text>
    <text data-theme-role="on-light-surface" x="1148" y="242" text-anchor="middle" font-size="13" fill="#8E8F9A">人工介入次数</text>
  </g>

  <g id="footer">
    <line x1="80" y1="608" x2="1200" y2="608" stroke="#23242E" stroke-width="1" />
    <text data-theme-role="on-light-surface" x="1200" y="648" text-anchor="end" font-size="13" fill="#7F8090">04 / 07</text>
  </g>
</svg>
