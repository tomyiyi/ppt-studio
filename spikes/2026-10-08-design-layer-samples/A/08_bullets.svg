<line x1="0" y1="440" x2="1280" y2="440" stroke="#4A7BA7" stroke-width="0.5" opacity="0.16"/><line x1="0" y1="480" x2="1280" y2="480" stroke="#4A7BA7" stroke-width="0.5" opacity="0.16"/><line x1="0" y1="520" x2="1280" y2="520" stroke="#4A7BA7" stroke-width="0.5" opacity="0.16"/><line x1="0" y1="560" x2="1280" y2="560" stroke="#4A7BA7" stroke-width="0.5" opacity="0.16"/><line x1="0" y1="600" x2="1280" y2="600" stroke="#4A7BA7" stroke-width="0.5" opacity="0.16"/><line x1="0" y1="640" x2="1280" y2="640" stroke="#4A7BA7" stroke-width="0.5" opacity="0.16"/><line x1="0" y1="680" x2="1280" y2="680" stroke="#4A7BA7" stroke-width="0.5" opacity="0.16"/><line x1="40" y1="92" x2="1240" y2="92" stroke="#4A7BA7" stroke-width="1"/><text x="40" y="68" font-family="Menlo, monospace" font-size="11" fill="#A9C0D8" letter-spacing="3">RUNHUA / PPT PIPELINE</text><text x="1240" y="68" font-family="Menlo, monospace" font-size="11" fill="#4FC9E8" text-anchor="end" letter-spacing="2">BK-A3</text><rect x="1010" y="628" width="230" height="62" fill="#16283C" stroke="#4A7BA7" stroke-width="1"/><line x1="1010" y1="649" x2="1240" y2="649" stroke="#4A7BA7" stroke-width="0.8"/><text x="1022" y="644" font-family="Menlo, monospace" font-size="11" fill="#A9C0D8" letter-spacing="2">TITLE BLOCK</text><text x="1022" y="668" font-size="13" fill="#E6EDF5">机制页 · 图位与遮罩</text><text x="1022" y="684" font-family="Menlo, monospace" font-size="11" fill="#A9C0D8">16:9  ·  spike  ·  2026-10-08</text><text x="40" y="148" font-size="56" fill="#E6EDF5" font-weight="700">一页只用一个图位</text><text x="40" y="180" font-size="20" fill="#A9C0D8">铺底 + 面板同图 = 重影；门禁按 href 去重判死。</text><rect x="44" y="214" width="470" height="300" fill="#16283C" stroke="#4FC9E8" stroke-width="1.4"/><text x="44" y="204" font-family="Menlo, monospace" font-size="11" fill="#4FC9E8" letter-spacing="2">COMPLIANT</text><rect x="45" y="215" width="468" height="298" fill="#4A7BA7" fill-opacity="0.25"/><text x="60" y="240" font-family="Menlo, monospace" font-size="13" fill="#E6EDF5">&lt;image&gt;  单图位  100% 铺底</text><rect x="68" y="364" width="422" height="120" fill="#0F1C2B" fill-opacity="0.66" stroke="#4A7BA7" stroke-width="1"/><text x="84" y="394" font-family="Menlo, monospace" font-size="13" fill="#E6EDF5">panel  fill-opacity=0.66</text><text x="84" y="418" font-size="16" fill="#A9C0D8">底图透得出来 → 不是第二块板</text><rect x="560" y="214" width="250" height="180" fill="#16283C" stroke="#E8A54F" stroke-width="1.4"/><rect x="580" y="234" width="210" height="140" fill="#4A7BA7" fill-opacity="0.3"/><rect x="620" y="270" width="160" height="100" fill="#0F1C2B" fill-opacity="0.6" stroke="#E8A54F" stroke-width="1"/><path d="M690 300 l30 30 m0 -30 l-30 30" stroke="#E8A54F" stroke-width="2"/><text x="560" y="204" font-family="Menlo, monospace" font-size="11" fill="#E8A54F" letter-spacing="2">BREACH</text><text x="570" y="414" font-size="16" fill="#E8A54F">同一 href 出现两次 → blocking</text><text x="840" y="204" font-family="Menlo, monospace" font-size="11" fill="#4FC9E8" letter-spacing="2">SCRIM RAMP</text><rect x="840" y="233" width="84" height="131" fill="#E6EDF5" fill-opacity="0.92"/><text x="844" y="384" font-family="Menlo, monospace" font-size="11" fill="#A9C0D8">0.00→0.92</text><rect x="936" y="246" width="84" height="118" fill="#E6EDF5" fill-opacity="0.8"/><text x="940" y="384" font-family="Menlo, monospace" font-size="11" fill="#A9C0D8">0.45→0.80</text><rect x="1032" y="301" width="84" height="63" fill="#E6EDF5" fill-opacity="0.3"/><text x="1036" y="384" font-family="Menlo, monospace" font-size="11" fill="#A9C0D8">0.62→0.30</text><rect x="1128" y="330" width="84" height="34" fill="#E6EDF5" fill-opacity="0.04"/><text x="1132" y="384" font-family="Menlo, monospace" font-size="11" fill="#A9C0D8">1.00→0.04</text><line x1="840" y1="364" x2="1212" y2="364" stroke="#4A7BA7" stroke-width="1"/><text x="840" y="410" font-size="16" fill="#A9C0D8">文字侧压住 · 空侧几乎不遮</text><line x1="44" y1="542" x2="1006" y2="542" stroke="#4A7BA7" stroke-width="0.6" opacity="0.5"/><text x="44" y="564" font-family="Menlo, monospace" font-size="13" fill="#4FC9E8" letter-spacing="1">scrim</text><text x="150" y="564" font-size="16" fill="#E6EDF5">方向性渐变，别整幅糊</text><text x="600" y="564" font-family="Menlo, monospace" font-size="13" fill="#A9C0D8">0→0.92 / 0.45→0.80 / 0.62→0.30 / 1→0.04</text><line x1="44" y1="582" x2="1006" y2="582" stroke="#4A7BA7" stroke-width="0.6" opacity="0.5"/><text x="44" y="604" font-family="Menlo, monospace" font-size="13" fill="#4FC9E8" letter-spacing="1">panel</text><text x="150" y="604" font-size="16" fill="#E6EDF5">卡片让底图透出</text><text x="600" y="604" font-family="Menlo, monospace" font-size="13" fill="#A9C0D8">fill-opacity="0.66"</text><line x1="44" y1="622" x2="1006" y2="622" stroke="#4A7BA7" stroke-width="0.6" opacity="0.5"/><text x="44" y="644" font-family="Menlo, monospace" font-size="13" fill="#4FC9E8" letter-spacing="1">clip</text><text x="150" y="644" font-size="16" fill="#E6EDF5">clip-path 挂 &lt;image&gt;</text><text x="600" y="644" font-family="Menlo, monospace" font-size="13" fill="#A9C0D8">挂外层 &lt;g&gt; → 门禁 blocking</text></svg>