="40" y="66" font-size="13" fill="#5F5747">参考卡 · 出片自检清单</text><text x="1240" y="66" font-family="Menlo, monospace" font-size="11" fill="#5F5747" text-anchor="end" letter-spacing="2">BK-B2</text><line x1="40" y1="80" x2="1240" y2="80" stroke="#C9BFA6" stroke-width="1"/><text x="120" y="148" font-size="44" fill="#2B2A26" font-weight="700">出片前必跑：八项自检</text><text x="120" y="180" font-size="16" fill="#5F5747">这一页允许密 —— 它是查表用的，不是读用的。</text><rect x="120" y="206" width="980" height="32" rx="4" fill="#EDE6D6"/><text x="132" y="227" font-size="13" fill="#2B2A26" font-weight="700">查什么</text><text x="252" y="227" font-size="13" fill="#2B2A26" font-weight="700">判据</text><text x="682" y="227" font-size="13" fill="#2B2A26" font-weight="700">阈值 / 算法</text><text x="1012" y="227" font-size="13" fill="#2B2A26" font-weight="700">性质</text><line x1="120" y1="282" x2="1100" y2="282" stroke="#C9BFA6" stroke-width="0.8"/><text x="132" y="266" font-size="16" fill="#2B2A26" font-weight="700">字号</text><text x="252" y="266" font-size="16" fill="#5F5747">所有文本字号落在 spec_lock 九档内</text><text x="682" y="266" font-family="Menlo, monospace" font-size="13" fill="#2B2A26">9 档 11/13/16/20/24/32/44/56/96</text><text x="1034" y="266" font-size="13" fill="#1B6B45" font-weight="700">✓ 必做</text><rect x="120" y="282" width="980" height="44" fill="#F7F4EC" fill-opacity="0.6"/><line x1="120" y1="326" x2="1100" y2="326" stroke="#C9BFA6" stroke-width="0.8"/><text x="132" y="310" font-size="16" fill="#2B2A26" font-weight="700">底图</text><text x="252" y="310" font-size="16" fill="#5F5747">最大 image 面积 / 画布面积</text><text x="682" y="310" font-family="Menlo, monospace" font-size="13" fill="#2B2A26">≥ 90%</text><text x="1034" y="310" font-size="13" fill="#1B6B45" font-weight="700">✓ 必做</text><line x1="120" y1="370" x2="1100" y2="370" stroke="#C9BFA6" stroke-width="0.8"/><text x="132" y="354" font-size="16" fill="#2B2A26" font-weight="700">重影</text><text x="252" y="354" font-size="16" fill="#5F5747">同一源图不在一页出现两次</text><text x="682" y="354" font-family="Menlo, monospace" font-size="13" fill="#2B2A26">href 去重 = 每页 1 次</text><text x="1034" y="354" font-size="13" fill="#C2410C" font-weight="700">! 易错</text><rect x="120" y="370" width="980" height="44" fill="#F7F4EC" fill-opacity="0.6"/><line x1="120" y1="414" x2="1100" y2="414" stroke="#C9BFA6" stroke-width="0.8"/><text x="132" y="398" font-size="16" fill="#2B2A26" font-weight="700">溢出</text><text x="252" y="398" font-size="16" fill="#5F5747">文本不超出画布</text><text x="682" y="398" font-family="Menlo, monospace" font-size="13" fill="#2B2A26">按 text-anchor 算边界</text><text x="1034" y="398" font-size="13" fill="#1B6B45" font-weight="700">✓ 必做</text><line x1="120" y1="458" x2="1100" y2="458" stroke="#C9BFA6" stroke-width="0.8"/><text x="132" y="442" font-size="16" fill="#2B2A26" font-weight="700">压行</text><text x="252" y="442" font-size="16" fill="#5F5747">相邻文本行不碰撞</text><text x="682" y="442" font-family="Menlo, monospace" font-size="13" fill="#2B2A26">行盒交集 = 0</text><text x="1034" y="442" font-size="13" fill="#1B6B45" font-weight="700">✓ 必做</text><rect x="120" y="458" width="980" height="44" fill="#F7F4EC" fill-opacity="0.6"/><line x1="120" y1="502" x2="1100" y2="502" stroke="#C9BFA6" stroke-width="0.8"/><text x="132" y="486" font-size="16" fill="#2B2A26" font-weight="700">面板</text><text x="252" y="486" font-size="16" fill="#5F5747">面板区域墨量</text><text x="682" y="486" font-family="Menlo, monospace" font-size="13" fill="#2B2A26">≥ 6%</text><text x="1034" y="486" font-size="13" fill="#1B6B45" font-weight="700">✓ 必做</text><line x1="120" y1="546" x2="1100" y2="546" stroke="#C9BFA6" stroke-width="0.8"/><text x="132" y="530" font-size="16" fill="#2B2A26" font-weight="700">对比</text><text x="252" y="530" font-size="16" fill="#5F5747">WCAG 文本对比度</text><text x="682" y="530" font-family="Menlo, monospace" font-size="13" fill="#2B2A26">≥ 4.5:1（底色取 20 分位）</text><text x="1034" y="530" font-size="13" fill="#C2410C" font-weight="700">! 易错</text><rect x="120" y="546" width="980" height="44" fill="#F7F4EC" fill-opacity="0.6"/><line x1="120" y1="590" x2="1100" y2="590" stroke="#C9BFA6" stroke-width="0.8"/><text x="132" y="574" font-size="16" fill="#2B2A26" font-weight="700">标题</text><text x="252" y="574" font-size="16" fill="#5F5747">每页根节点带 title</text><text x="682" y="574" font-family="Menlo, monospace" font-size="13" fill="#2B2A26">&lt;title&gt; 存在（18 条 WARN → 0）</text><text x="1034" y="574" font-size="13" fill="#245C9E" font-weight="700">+ 新加</text><line x1="120" y1="590" x2="1100" y2="590" stroke="#C9BFA6" stroke-width="1"/><line x1="240" y1="206" x2="240" y2="590" stroke="#C9BFA6" stroke-width="0.8"/><line x1="670" y1="206" x2="670" y2="590" stroke="#C9BFA6" stroke-width="0.8"/><line x1="1000" y1="206" x2="1000" y2="590" stroke="#C9BFA6" stroke-width="0.8"/><rect x="120" y="590" width="6" height="384" fill="#C2410C"/><text x="1090" y="620" font-family="ZCOOL KuaiLe, Noto Sans SC, sans-serif" font-size="13" fill="#C2410C">这两项最容易忘</text><path d="M1094 628 q-22 -38 -48 -104" fill="none" stroke="#C2410C" stroke-width="1.6" stroke-linecap="round"/><circle cx="1046" cy="524" r="3" fill="#C2410C"/><text x="120" y="636" font-size="16" fill="#5F5747">✓ 必做   ! 易错   + 新加（本轮补的根 title 门禁）</text><text x="120" y="660" font-family="Menlo, monospace" font-size="13" fill="#5F5747">版本  workflow_full · 2026-10-08 —— 阈值随版本变，用前先核对 spec_lock.md</text></svg>