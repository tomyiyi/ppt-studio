<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1280 720" font-family="Noto Sans SC, sans-serif"><title>最容易翻车的一步：同一张图铺两遍</title><rect x="0" y="0" width="1280" height="720" fill="#F7F4EC"/><line x1="40" y1="96" x2="1240" y2="96" stroke="#C9BFA6" stroke-width="0.5" opacity="0.35"/><line x1="40" y1="130" x2="1240" y2="130" stroke="#C9BFA6" stroke-width="0.5" opacity="0.35"/><line x1="40" y1="164" x2="1240" y2="164" stroke="#C9BFA6" stroke-width="0.5" opacity="0.35"/><line x1="40" y1="198" x2="1240" y2="198" stroke="#C9BFA6" stroke-width="0.5" opacity="0.35"/><line x1="40" y1="232" x2="1240" y2="232" stroke="#C9BFA6" stroke-width="0.5" opacity="0.35"/><line x1="40" y1="266" x2="1240" y2="266" stroke="#C9BFA6" stroke-width="0.5" opacity="0.35"/><line x1="40" y1="300" x2="1240" y2="300" stroke="#C9BFA6" stroke-width="0.5" opacity="0.35"/><line x1="40" y1="334" x2="1240" y2="334" stroke="#C9BFA6" stroke-width="0.5" opacity="0.35"/><line x1="40" y1="368" x2="1240" y2="368" stroke="#C9BFA6" stroke-width="0.5" opacity="0.35"/><line x1="40" y1="402" x2="1240" y2="402" stroke="#C9BFA6" stroke-width="0.5" opacity="0.35"/><line x1="40" y1="436" x2="1240" y2="436" stroke="#C9BFA6" stroke-width="0.5" opacity="0.35"/><line x1="40" y1="470" x2="1240" y2="470" stroke="#C9BFA6" stroke-width="0.5" opacity="0.35"/><line x1="40" y1="504" x2="1240" y2="504" stroke="#C9BFA6" stroke-width="0.5" opacity="0.35"/><line x1="40" y1="538" x2="1240" y2="538" stroke="#C9BFA6" stroke-width="0.5" opacity="0.35"/><line x1="40" y1="572" x2="1240" y2="572" stroke="#C9BFA6" stroke-width="0.5" opacity="0.35"/><line x1="40" y1="606" x2="1240" y2="606" stroke="#C9BFA6" stroke-width="0.5" opacity="0.35"/><line x1="40" y1="640" x2="1240" y2="640" stroke="#C9BFA6" stroke-width="0.5" opacity="0.35"/><line x1="40" y1="674" x2="1240" y2="674" stroke="#C9BFA6" stroke-width="0.5" opacity="0.35"/><line x1="96" y1="40" x2="96" y2="680" stroke="#C2410C" stroke-width="1" opacity="0.22"/><text x="40" y="66" font-size="13" fill="#5F5747">易错对照 · 图位与遮罩</text><text x="1240" y="66" font-family="Menlo, monospace" font-size="11" fill="#5F5747" text-anchor="end" letter-spacing="2">BK-B3</text><line x1="40" y1="80" x2="1240" y2="80" stroke="#C9BFA6" stroke-width="1"/><text x="120" y="146" font-size="44" fill="#2B2A26" font-weight="700">最容易翻车的一步：同一张图铺两遍</text><text x="120" y="176" font-size="16" fill="#5F5747">错面和对面并排摆 —— 只给正确答案，你会在下一次同样踩。</text><rect x="120" y="200" width="340" height="230" rx="6" fill="#EDE6D6" stroke="#C2410C" stroke-width="2"/><text x="136" y="232" font-size="20" fill="#C2410C" font-weight="700">!  错</text><rect x="140" y="248" width="300" height="150" rx="2" fill="#C9BFA6" fill-opacity="0.55"/><rect x="210" y="310" width="210" height="78" rx="2" fill="#F7F4EC" stroke="#C2410C" stroke-width="1"/><text x="140" y="416" font-size="16" fill="#C2410C">铺底 + 面板都用它 → 重影</text><rect x="500" y="200" width="340" height="230" rx="6" fill="#EDE6D6" stroke="#1B6B45" stroke-width="2"/><text x="516" y="232" font-size="20" fill="#1B6B45" font-weight="700">✓  对</text><rect x="520" y="248" width="300" height="150" rx="2" fill="#C9BFA6" fill-opacity="0.55"/><rect x="590" y="310" width="210" height="78" rx="2" fill="#2B2A26" fill-opacity="0.34"/><text x="520" y="416" font-size="16" fill="#1B6B45">一页只挂一个图位；卡片透底</text><path d="M472 320 q40 -18 70 2" fill="none" stroke="#1B6B45" stroke-width="2.4" stroke-linecap="round"/><text x="880" y="224" font-size="20" fill="#2B2A26" font-weight="700">遮罩按方向给，别整幅糊</text><rect x="880" y="236" width="82" height="114" fill="#2B2A26" fill-opacity="0.92"/><text x="884" y="370" font-family="Menlo, monospace" font-size="11" fill="#5F5747">0.00→0.92</text><rect x="972" y="248" width="82" height="102" fill="#2B2A26" fill-opacity="0.8"/><text x="976" y="370" font-family="Menlo, monospace" font-size="11" fill="#5F5747">0.45→0.80</text><rect x="1064" y="296" width="82" height="54" fill="#2B2A26" fill-opacity="0.3"/><text x="1068" y="370" font-family="Menlo, monospace" font-size="11" fill="#5F5747">0.62→0.30</text><rect x="1156" y="321" width="82" height="29" fill="#2B2A26" fill-opacity="0.04"/><text x="1160" y="370" font-family="Menlo, monospace" font-size="11" fill="#5F5747">1.00→0.04</text><line x1="880" y1="350" x2="1238" y2="350" stroke="#C9BFA6" stroke-width="1"/><text x="880" y="394" font-size="16" fill="#5F5747">文字侧 0.92 · 空侧 0.04</text><text x="920" y="436" font-family="ZCOOL KuaiLe, Noto Sans SC, sans-serif" font-size="13" fill="#245C9E">这就是「墨量」从哪来</text><path d="M924 444 q0 -63 -3 -154" fill="none" stroke="#245C9E" stroke-width="1.6" stroke-linecap="round"/><circle cx="921" cy="290" r="3" fill="#245C9E"/><rect x="120" y="462" width="1060" height="46" rx="4" fill="#EDE6D6"/><text x="140" y="490" font-size="16" fill="#245C9E" font-weight="700">+ scrim</text><text x="300" y="490" font-size="16" fill="#2B2A26">方向性渐变，别整幅糊</text><text x="700" y="490" font-family="Menlo, monospace" font-size="13" fill="#5F5747">0→0.92 / 0.45→0.80 / 0.62→0.30 / 1→0.04</text><rect x="120" y="518" width="1060" height="46" rx="4" fill="#EDE6D6"/><text x="140" y="546" font-size="16" fill="#1B6B45" font-weight="700">✓ panel</text><text x="300" y="546" font-size="16" fill="#2B2A26">卡片让底图透出</text><text x="700" y="546" font-family="Menlo, monospace" font-size="13" fill="#5F5747">fill-opacity="0.66"</text><rect x="120" y="574" width="1060" height="46" rx="4" fill="#EDE6D6"/><text x="140" y="602" font-size="16" fill="#1B6B45" font-weight="700">✓ clip</text><text x="300" y="602" font-size="16" fill="#2B2A26">clip-path 挂 &lt;image&gt;</text><text x="700" y="602" font-family="Menlo, monospace" font-size="13" fill="#5F5747">挂外层 &lt;g&gt; → 门禁 blocking</text><text x="120" y="656" font-size="13" fill="#5F5747">标为简化：这里的数值来自本项目 spec_lock 的实测收紧记录，不是通用标准；换项目要重定。</text><text x="120" y="690" font-family="Menlo, monospace" font-size="13" fill="#5F5747">版本  workflow_full · 2026-10-08</text></svg>