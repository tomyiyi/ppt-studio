<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1280 720" font-family="Noto Sans SC, sans-serif"><title>学完你能独立跑通：Markdown → 可编辑 PPTX</title><rect x="0" y="0" width="1280" height="720" fill="#F7F4EC"/><line x1="40" y1="96" x2="1240" y2="96" stroke="#C9BFA6" stroke-width="0.5" opacity="0.35"/><line x1="40" y1="130" x2="1240" y2="130" stroke="#C9BFA6" stroke-width="0.5" opacity="0.35"/><line x1="40" y1="164" x2="1240" y2="164" stroke="#C9BFA6" stroke-width="0.5" opacity="0.35"/><line x1="40" y1="198" x2="1240" y2="198" stroke="#C9BFA6" stroke-width="0.5" opacity="0.35"/><line x1="40" y1="232" x2="1240" y2="232" stroke="#C9BFA6" stroke-width="0.5" opacity="0.35"/><line x1="40" y1="266" x2="1240" y2="266" stroke="#C9BFA6" stroke-width="0.5" opacity="0.35"/><line x1="40" y1="300" x2="1240" y2="300" stroke="#C9BFA6" stroke-width="0.5" opacity="0.35"/><line x1="40" y1="334" x2="1240" y2="334" stroke="#C9BFA6" stroke-width="0.5" opacity="0.35"/><line x1="40" y1="368" x2="1240" y2="368" stroke="#C9BFA6" stroke-width="0.5" opacity="0.35"/><line x1="40" y1="402" x2="1240" y2="402" stroke="#C9BFA6" stroke-width="0.5" opacity="0.35"/><line x1="40" y1="436" x2="1240" y2="436" stroke="#C9BFA6" stroke-width="0.5" opacity="0.35"/><line x1="40" y1="470" x2="1240" y2="470" stroke="#C9BFA6" stroke-width="0.5" opacity="0.35"/><line x1="40" y1="504" x2="1240" y2="504" stroke="#C9BFA6" stroke-width="0.5" opacity="0.35"/><line x1="40" y1="538" x2="1240" y2="538" stroke="#C9BFA6" stroke-width="0.5" opacity="0.35"/><line x1="40" y1="572" x2="1240" y2="572" stroke="#C9BFA6" stroke-width="0.5" opacity="0.35"/><line x1="40" y1="606" x2="1240" y2="606" stroke="#C9BFA6" stroke-width="0.5" opacity="0.35"/><line x1="40" y1="640" x2="1240" y2="640" stroke="#C9BFA6" stroke-width="0.5" opacity="0.35"/><line x1="40" y1="674" x2="1240" y2="674" stroke="#C9BFA6" stroke-width="0.5" opacity="0.35"/><line x1="96" y1="40" x2="96" y2="680" stroke="#C2410C" stroke-width="1" opacity="0.22"/><text x="40" y="66" font-size="13" fill="#5F5747">封面 · 学习目标契约</text><text x="1240" y="66" font-family="Menlo, monospace" font-size="11" fill="#5F5747" text-anchor="end" letter-spacing="2">BK-B1</text><line x1="40" y1="80" x2="1240" y2="80" stroke="#C9BFA6" stroke-width="1"/><text x="120" y="150" font-size="32" fill="#5F5747">学完这份材料，你能独立跑通：</text><text x="120" y="214" font-family="Menlo, monospace" font-size="56" fill="#2B2A26" font-weight="700">Markdown → 可编辑 PPTX</text><path d="M120 232 q420 22 830 4" fill="none" stroke="#1B6B45" stroke-width="3" stroke-linecap="round"/><text x="120" y="290" font-size="20" fill="#2B2A26" font-weight="700">三个可检验的结果（不是「看完觉得会了」）</text><text x="120" y="336" font-family="Menlo, monospace" font-size="24" fill="#1B6B45">□</text><text x="160" y="336" font-size="20" fill="#2B2A26" font-weight="700">出片</text><text x="270" y="336" font-size="16" fill="#5F5747">给定一篇 md，跑出能在 PowerPoint 里改字改色的 .pptx</text><text x="120" y="382" font-family="Menlo, monospace" font-size="24" fill="#1B6B45">□</text><text x="160" y="382" font-size="20" fill="#2B2A26" font-weight="700">判合格</text><text x="270" y="382" font-size="16" fill="#5F5747">知道八道门禁各判什么，能自己复跑并读出 JSON 摘要</text><text x="120" y="428" font-family="Menlo, monospace" font-size="24" fill="#1B6B45">□</text><text x="160" y="428" font-size="20" fill="#2B2A26" font-weight="700">查翻车</text><text x="270" y="428" font-size="16" fill="#5F5747">图糊 / 图空 / 竖线三类现象，能说出真因和修法</text><text x="1040" y="150" font-family="ZCOOL KuaiLe, Noto Sans SC, sans-serif" font-size="13" fill="#1B6B45">这一句就是契约</text><path d="M1044 158 q-70 52 -144 76" fill="none" stroke="#1B6B45" stroke-width="1.6" stroke-linecap="round"/><circle cx="900" cy="234" r="3" fill="#1B6B45"/><rect x="120" y="512" width="1060" height="150" rx="6" fill="#EDE6D6"/><text x="140" y="546" font-size="20" fill="#2B2A26" font-weight="700">开始前的三个前提</text><text x="140" y="578" font-size="16" fill="#5F5747">· 机器上有 3TB 工程中心的 ppt-studio（代码只认这一处真相源）</text><text x="140" y="604" font-size="16" fill="#5F5747">· 生图通道可用（缺 key 只报变量名，不打印明文）</text><text x="140" y="630" font-size="16" fill="#5F5747">· Chrome headless 能截图 —— 看图被拦截时靠 OCR 客观验收</text><text x="120" y="692" font-family="Menlo, monospace" font-size="13" fill="#5F5747">spike 样张 · 2026-10-08 · 版式来自 ppt-master workshop-teaching + sketch-notes</text></svg>