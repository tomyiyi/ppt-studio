    <text id="hero-side-title-carrier"
      x="80"  fill="#FFFFFF" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, Arial, sans-serif"
      font-size="32" font-weight="700" y="300">三种意图同框</text>
  </g>
  <g id="hero-side-body-slot"
    data-pptx-bounds="80 356 640 200">
    <text x="80" y="398" fill="#B4232A" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="16">• </text>
<text x="94" y="398" fill="#FFFFFF" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="16">vector 生成 pXX_vector.png 并留 prov.jso</text>
<text x="80" y="418" fill="#FFFFFF" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="16">  n</text>
<text x="80" y="456" fill="#B4232A" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="16">• </text>
<text x="94" y="456" fill="#FFFFFF" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="16">栅格化走 render_svg_cairo（unsafe+字体规范化）</text>
<text x="80" y="494" fill="#B4232A" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="16">• </text>
<text x="94" y="494" fill="#FFFFFF" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="16">cairosvg 不可用时如实缓办，不产半成品</text>
  </g>
