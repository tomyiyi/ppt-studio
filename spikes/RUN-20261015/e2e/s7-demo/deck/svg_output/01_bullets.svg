<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1280 720"><title>三种意图同框</title>
  <defs>
    <linearGradient id="hero-side-scrim-paint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.14"/>
      <stop offset="0.82" stop-color="#000000" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect id="master-background" x="0" y="0" width="1280" height="720" fill="#0F172A"/><image href="../images/p01_vector.png" x="0" y="0" width="1280" height="720" preserveAspectRatio="none"/>
  <g id="hero-side-picture-slot">
    
  </g>
  <rect id="hero-side-scrim" x="0" y="0" width="880" height="720"
    fill="url(#hero-side-scrim-paint)" data-pptx-role="decoration"/>
  <g id="hero-side-title-slot"
