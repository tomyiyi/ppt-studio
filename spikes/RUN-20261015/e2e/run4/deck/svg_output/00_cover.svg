<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1280 720"><title>远程交付团队的周会节奏（测试夹具）</title>
  <defs>
    <linearGradient id="hero-full-scrim-paint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.43" stop-color="#000000" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.13"/>
    </linearGradient>
  </defs>
  <rect id="master-background" x="0" y="0" width="1280" height="720" fill="#0F172A"/><image href="../images/p00_bg.png" x="0" y="0" width="1280" height="720" preserveAspectRatio="none"/>
  <g id="hero-full-picture-slot">
    
  </g>
  <rect id="hero-full-scrim" x="0" y="240" width="1280" height="480"
    fill="url(#hero-full-scrim-paint)" data-pptx-role="decoration"/>
  <g id="hero-full-title-slot"
    data-pptx-bounds="80 448 1120 96">
    <text id="hero-full-title-carrier"
      x="80"  fill="#FFFFFF" font-family="SmileySans, '思源黑 Heavy', sans-serif"
      font-size="56" font-weight="700" y="518">远程交付团队的周</text>
  </g>
  <g id="hero-full-subtitle-slot"
    data-pptx-bounds="80 568 880 56">
    <text id="hero-full-subtitle-carrier"
      x="80" y="606" fill="#E2E8F0" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, Arial, sans-serif"
      font-size="20">本次研究通过双源验证的核心发现有 5 条，具体判断见正文各节。</text>
  </g>
<rect id="agnes-accent-rule" x="80" y="560" width="64" height="4" fill="#B4232A" data-pptx-role="decoration" data-agnes-accent="true"/>
</svg>
